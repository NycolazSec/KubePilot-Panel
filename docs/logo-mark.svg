<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="KubePilot">
  <defs>
    <linearGradient id="kp-ring" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="kp-arrow" x1="40" y1="36" x2="92" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <!-- hexagone = un pod / un conteneur -->
  <path d="M64 10 L110.8 37 V91 L64 118 L17.2 91 V37 Z" fill="none" stroke="url(#kp-ring)" stroke-width="9" stroke-linejoin="round"/>
  <!-- noeuds du cluster aux sommets -->
  <g fill="#8b5cf6"><circle cx="64" cy="10" r="6.5"/><circle cx="110.8" cy="91" r="6.5" fill="#3b82f6"/><circle cx="17.2" cy="91" r="6.5" fill="#6d5df6"/></g>
  <!-- fleche de navigation = le pilote -->
  <path d="M88 38 L40 60 L60.5 67.5 L68 88 Z" fill="url(#kp-arrow)" stroke="url(#kp-arrow)" stroke-width="5" stroke-linejoin="round"/>
</svg>
