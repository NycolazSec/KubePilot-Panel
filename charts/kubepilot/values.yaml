image:
  repository: ghcr.io/nycolazsec/kubepilot-panel
  # Defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

# Namespace where game servers run. It is kept on `helm uninstall` so that game data is never lost.
serversNamespace:
  name: kubepilot-servers
  create: true
  # Pterodactyl / Pelican eggs: their install scripts run as root (no privilege escalation, minimal
  # capabilities, seccomp). This needs the namespace at Pod Security "baseline"; game servers themselves are
  # always created non-root, without capabilities (the "restricted" profile is still audited and warned about).
  # false = "restricted" enforced: eggs whose install script needs root won't install.
  rootInstall: true

# Game server volumes. The file manager and backups read them directly on the node,
# so they must come from a hostPath-based provisioner such as local-path.
storage:
  # Isolation (recommended): the chart creates a StorageClass that puts game volumes in their own folder
  # (<hostPath>/<serversNamespace>/<claim>/), and the panel only mounts that folder — never the volumes
  # of the other applications of the cluster. Needs rancher/local-path-provisioner >= v0.0.27 (k3s ≥ 1.30).
  isolated: true
  # StorageClass of game volumes: created by the chart when `isolated`, an existing hostPath-based one otherwise
  className: kubepilot-local
  provisioner: rancher.io/local-path
  # Directory where the provisioner creates volumes on the node:
  #   k3s: /var/lib/rancher/k3s/storage — rancher/local-path-provisioner: /opt/local-path-provisioner
  hostPath: /var/lib/rancher/k3s/storage
  # Node that holds the volumes; the panel runs there. Leave empty on a single-node cluster.
  node: ""

# Panel data: SQLite database and backups. The claim is kept on `helm uninstall`.
persistence:
  size: 20Gi
  # Empty = the cluster's default StorageClass
  storageClass: ""
  # Use an existing PersistentVolumeClaim instead of creating one
  existingClaim: ""

ingress:
  enabled: true
  # Empty = the cluster's default IngressClass (Traefik on k3s)
  className: ""
  # Public domain of the panel, e.g. panel.example.com (required when the ingress is enabled)
  host: ""
  # cert-manager ClusterIssuer that issues the TLS certificate, e.g. letsencrypt-prod
  clusterIssuer: ""
  annotations: {}
  tls:
    enabled: true
    secretName: kubepilot-tls
  # Traefik only: refuse every request that doesn't come from these networks (direct hits on the origin IP).
  # `cloudflareOnly` fills the list with Cloudflare's ranges: use it when the domain is proxied by Cloudflare,
  # so nobody can bypass Cloudflare's protections by reaching the node directly.
  cloudflareOnly: false
  sourceRanges: []
  # https://www.cloudflare.com/ips/
  cloudflareRanges: [173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
    190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14,
    172.64.0.0/13, 131.0.72.0/22, 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32,
    2a06:98c0::/29, 2c0f:f248::/32]

# Built-in SFTP server (FileZilla, WinSCP, sftp…): users sign in as <username>.<server id> with their panel
# password, or an SSH key added in My account (required for accounts with two-factor authentication).
sftp:
  enabled: true
  # Port users connect to. 2022 is also Pterodactyl Wings' SFTP port: pick another one if Wings runs on the nodes.
  port: 2022
  # true: the port is opened on the panel's node (hostPort) and the panel sees the client's real IP, which the
  # per-IP sign-in limits and the activity log need. k3s ServiceLB (klipper-lb) masquerades connections, so with
  # it every client would share one IP. false: a Service of sftp.service.type is created instead.
  hostPort: true
  service:
    type: LoadBalancer # MetalLB, a cloud load balancer… (NodePort works too)
    # Local keeps the client's IP with load balancers that support it
    externalTrafficPolicy: Local
    nodePort: null
    annotations: {}


# Backups on S3-compatible storage (AWS, Backblaze B2, OVH, Scaleway, Cloudflare R2, MinIO…) instead of the panel's
# volume. Backups made before keep working from where they are.
backups:
  s3:
    enabled: false
    endpoint: "" # e.g. s3.eu-west-3.amazonaws.com, s3.gra.io.cloud.ovh.net, <account>.r2.cloudflarestorage.com
    region: ""
    bucket: ""
    prefix: kubepilot
    insecure: false # plain HTTP, for an in-cluster MinIO only
    # Secret with the keys access-key, secret-key and optionally encryption-key; or set the values below and the
    # chart creates it.
    existingSecret: ""
    accessKey: ""
    secretKey: ""
    # age secret key (age-keygen → AGE-SECRET-KEY-1…): archives are encrypted before they leave the panel. Keep a
    # copy somewhere safe: without it, encrypted backups can't be restored (age -d -i key.txt also works by hand).
    encryptionKey: ""

# MySQL / MariaDB databases for the game servers (Databases tab): one MariaDB next to the servers, one database and
# one user per request, reachable only by the game servers and the panel.
databases:
  enabled: true
  image: { repository: mariadb, tag: "11.4", pullPolicy: IfNotPresent }
  maxConnections: 300
  persistence:
    size: 10Gi
    storageClass: "" # cluster default (k3s: local-path)
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

# Minecraft router (itzg/mc-router): players join Java servers at <hostname>.<domain> on the standard port 25565
# instead of <node>:<NodePort>. Set the domain in the admin settings and point a wildcard DNS record
# (*.<domain>, DNS only — not proxied) at your nodes.
minecraftRouter:
  enabled: false
  image: itzg/mc-router:1.56.5
  service:
    # LoadBalancer: k3s' ServiceLB (or MetalLB…) binds the port on the nodes
    type: LoadBalancer
    port: 25565
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

service:
  type: ClusterIP
  port: 80

# Keep true in production: cookies are only sent over HTTPS. Set false only to test over plain HTTP.
secureCookies: true

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: "2", memory: 1Gi }

extraEnv: []
podAnnotations: {}
tolerations: []
