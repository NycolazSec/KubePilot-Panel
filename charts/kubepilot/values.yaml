image:
  repository: ghcr.io/nycolazsec/kubepilot-panel
  # Defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

# Namespace where game servers run. It is kept on `helm uninstall` so that game data is never lost.
serversNamespace:
  name: kubepilot-servers
  create: true
  # Pterodactyl / Pelican eggs: their install scripts run as root (no privilege escalation, minimal
  # capabilities, seccomp). This needs the namespace at Pod Security "baseline"; game servers themselves are
  # always created non-root, without capabilities (the "restricted" profile is still audited and warned about).
  # false = "restricted" enforced: eggs whose install script needs root won't install.
  rootInstall: true
  # Game servers are cut off from the cluster, but may reach the websites it serves through their public address
  # (a bot fetching its own dashboard, a plugin calling a site of yours): those connections land on the ingress
  # controller's pods, so only these ports of these pods open up. Defaults: Traefik on k3s. namespace "" = closed.
  ingressController:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
    # its entry points (container port names or numbers) for HTTP and HTTPS: not its dashboard or metrics
    ports: [web, websecure]

# Game server volumes. The file manager and backups read them directly on the node,
# so they must come from a hostPath-based provisioner such as local-path.
storage:
  # Isolation (recommended): the chart creates a StorageClass that puts game volumes in their own folder
  # (<hostPath>/<serversNamespace>/<claim>/), and the panel only mounts that folder — never the volumes
  # of the other applications of the cluster. Needs rancher/local-path-provisioner >= v0.0.27 (k3s ≥ 1.30).
  isolated: true
  # StorageClass of game volumes: created by the chart when `isolated`, an existing hostPath-based one otherwise
  className: kubepilot-local
  provisioner: rancher.io/local-path
  # Directory where the provisioner creates volumes on the node:
  #   k3s: /var/lib/rancher/k3s/storage — rancher/local-path-provisioner: /opt/local-path-provisioner
  hostPath: /var/lib/rancher/k3s/storage
  # Node the panel runs on: it mounts the game volumes of that node and reaches the other nodes' volumes
  # through their agents (nodeAgent). Leave empty on a single-node cluster.
  node: ""

# Panel data: SQLite database and backups. The claim is kept on `helm uninstall`.
persistence:
  size: 20Gi
  # Empty = the cluster's default StorageClass
  storageClass: ""
  # Use an existing PersistentVolumeClaim instead of creating one
  existingClaim: ""

ingress:
  enabled: true
  # Empty = the cluster's default IngressClass (Traefik on k3s)
  className: ""
  # Public domain of the panel, e.g. panel.example.com (required when the ingress is enabled)
  host: ""
  # cert-manager ClusterIssuer that issues the TLS certificate, e.g. letsencrypt-prod
  clusterIssuer: ""
  annotations: {}
  tls:
    enabled: true
    secretName: kubepilot-tls
  # Traefik only: refuse every request that doesn't come from these networks (direct hits on the origin IP).
  # `cloudflareOnly` fills the list with Cloudflare's ranges: use it when the domain is proxied by Cloudflare,
  # so nobody can bypass Cloudflare's protections by reaching the node directly.
  cloudflareOnly: false
  sourceRanges: []
  # https://www.cloudflare.com/ips/
  cloudflareRanges: [173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
    190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14,
    172.64.0.0/13, 131.0.72.0/22, 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32,
    2a06:98c0::/29, 2c0f:f248::/32]

# Built-in SFTP server (FileZilla, WinSCP, sftp…): users sign in as <username>.<server id> with their panel
# password, or an SSH key added in My account (required for accounts with two-factor authentication).
sftp:
  enabled: true
  # Port users connect to. 2022 is also Pterodactyl Wings' SFTP port: pick another one if Wings runs on the nodes.
  port: 2022
  # true: the port is opened on the panel's node (hostPort) and the panel sees the client's real IP, which the
  # per-IP sign-in limits and the activity log need. k3s ServiceLB (klipper-lb) masquerades connections, so with
  # it every client would share one IP. false: a Service of sftp.service.type is created instead.
  hostPort: true
  service:
    type: LoadBalancer # MetalLB, a cloud load balancer… (NodePort works too)
    # Local keeps the client's IP with load balancers that support it
    externalTrafficPolicy: Local
    nodePort: null
    annotations: {}


# Backups on S3-compatible storage (AWS, Backblaze B2, OVH, Scaleway, Cloudflare R2, MinIO…) instead of the panel's
# volume. Backups made before keep working from where they are.
backups:
  s3:
    enabled: false
    endpoint: "" # e.g. s3.eu-west-3.amazonaws.com, s3.gra.io.cloud.ovh.net, <account>.r2.cloudflarestorage.com
    region: ""
    bucket: ""
    prefix: kubepilot
    insecure: false # plain HTTP, for an in-cluster MinIO only
    # Secret with the keys access-key, secret-key and optionally encryption-key; or set the values below and the
    # chart creates it.
    existingSecret: ""
    accessKey: ""
    secretKey: ""
    # age secret key (age-keygen → AGE-SECRET-KEY-1…): archives are encrypted before they leave the panel. Keep a
    # copy somewhere safe: without it, encrypted backups can't be restored (age -d -i key.txt also works by hand).
    encryptionKey: ""

# Emails: "forgot your password" links (and notifications). Off while smtp.host is empty.
email:
  smtp:
    host: "" # e.g. smtp.gmail.com, smtp-relay.brevo.com, ssl0.ovh.net, email-smtp.eu-west-3.amazonaws.com
    port: 0 # 0 = the usual port of the TLS mode (587, 465 or 25)
    # starttls (port 587) | tls (implicit TLS, port 465) | none (unencrypted: an in-cluster relay only; the
    # panel never sends a password without TLS)
    tls: starttls
    username: ""
    # Secret with the key "password"; or pass the password with --set email.smtp.password=… and the chart
    # creates that Secret.
    existingSecret: ""
  # Sender, e.g. "KubePilot <panel@example.com>" (the SMTP account must be allowed to send as this address)
  from: ""

# The panel's public address, for links in emails. Default: https://<ingress.host>
publicURL: ""

# MySQL / MariaDB databases for the game servers (Databases tab): one MariaDB next to the servers, one database and
# one user per request, reachable only by the game servers and the panel.
databases:
  enabled: true
  image: { repository: mariadb, tag: "11.4", pullPolicy: IfNotPresent }
  maxConnections: 300
  persistence:
    size: 10Gi
    storageClass: "" # cluster default (k3s: local-path)
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

# Minecraft router (itzg/mc-router): players join Java servers at <hostname>.<domain> on the standard port 25565
# instead of <node>:<NodePort>. Set the domain in the admin settings and point a wildcard DNS record
# (*.<domain>, DNS only — not proxied) at your nodes.
minecraftRouter:
  enabled: false
  image: itzg/mc-router:1.56.5
  service:
    # LoadBalancer: k3s' ServiceLB (or MetalLB…) binds the port on the nodes
    type: LoadBalancer
    port: 25565
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }
  # Auto-sleep: servers whose owner turned it on stop after some minutes without players, and start again when
  # a player joins their address. The texts below are what players see in their server list / when kicked.
  autoSleep:
    enabled: true
    asleepMOTD: "§7Sleeping — join to wake it up"
    loadingMOTD: "§eStarting… come back in a minute"
    wakeMessage: "The server is waking up: reconnect in about a minute!"

# Firewall and anti-DDoS, managed in Admin → Firewall (off by default). One agent per node filters the game ports
# with nftables — the servers' ports and the Minecraft router, never SSH, the panel or the Kubernetes API:
# firewall rules per server and for the whole panel, limits per source IP, automatic bans, an "under attack" mode.
# The agents use the host network and the NET_ADMIN capability (nothing else): the release namespace must allow
# it (Pod Security "privileged"). They filter what reaches the nodes; an attack bigger than a node's link has to be
# stopped upstream (your host's anti-DDoS, or a provider such as path.net).
# Several nodes: one small agent per node serves the files of the game servers placed on that node to the
# panel (file manager, SFTP, backups, plugins). It listens on the pod network for the panel only (NetworkPolicy
# + keys derived from a Secret the chart creates) and has no Kubernetes credentials. Without it, the panel
# only reaches the files of its own node.
nodeAgent:
  enabled: true
  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { cpu: 500m, memory: 256Mi }
  nodeSelector: {}
  # the nodes game servers may run on: none of the tainted ones by default, like the servers themselves
  tolerations: []

# Prometheus metrics: /metrics on a port of its own and a ClusterIP Service of its own, never through the
# ingress (server names and player counts aren't for the internet). Game servers (state, CPU, memory, disk,
# players, restarts, backups), nodes, ports and the firewall. Grafana dashboard: dashboards/kubepilot.json.
metrics:
  enabled: true
  port: 9090
  # optional bearer token Prometheus must send (kept in the <release>-metrics Secret); empty: none
  token: ""
  # Prometheus Operator (kube-prometheus-stack): a ServiceMonitor for the metrics Service
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # a ConfigMap the Grafana sidecar of kube-prometheus-stack picks up: the KubePilot dashboard appears in Grafana
  grafanaDashboard:
    enabled: false
    namespace: ""   # default: the release namespace
    labels: { grafana_dashboard: "1" }

# "Add a machine" in Admin -> Machines gives one command to paste on the new machine: the panel creates the k3s
# invitation itself (a bootstrap token valid 24 hours). It needs to create Secrets in kube-system (create only:
# it can't read any). false: invitations come from `install.sh add-node` on the main machine.
nodeInvites:
  enabled: true

shield:
  enabled: false
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { cpu: 200m, memory: 96Mi }
  # Nodes to protect: every node by default (the agent tolerates every taint)
  nodeSelector: {}
  tolerations:
    - operator: Exists

service:
  type: ClusterIP
  port: 80

# Keep true in production: cookies are only sent over HTTPS. Set false only to test over plain HTTP.
secureCookies: true

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: "2", memory: 1Gi }

extraEnv: []
podAnnotations: {}
tolerations: []
