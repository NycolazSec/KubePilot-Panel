{{- if and .Values.backups.s3.enabled (not .Values.backups.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubepilot.fullname" . }}-s3
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kubepilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ required "backups.s3.accessKey is required (or backups.s3.existingSecret)" .Values.backups.s3.accessKey | quote }}
  secret-key: {{ required "backups.s3.secretKey is required (or backups.s3.existingSecret)" .Values.backups.s3.secretKey | quote }}
  {{- with .Values.backups.s3.encryptionKey }}
  encryption-key: {{ . | quote }}
  {{- end }}
{{- end }}
