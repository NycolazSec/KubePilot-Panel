apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubepilot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kubepilot.labels" . | nindent 4 }}
spec:
  # SQLite database: a single replica, replaced (not rolled) on upgrade
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "kubepilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kubepilot.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubepilot.fullname" . }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.storage.node }}
      # The file manager reads the game volumes: same node as the servers
      nodeSelector:
        kubernetes.io/hostname: {{ . | quote }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: panel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: KUBEPILOT_NAMESPACE, value: {{ .Values.serversNamespace.name | quote }} }
            - { name: KUBEPILOT_STORAGE_ROOT, value: {{ include "kubepilot.volumesPath" . | quote }} }
            - { name: KUBEPILOT_STORAGE_CLASS, value: {{ .Values.storage.className | quote }} }
            - { name: KUBEPILOT_DATA, value: /data }
            - { name: KUBEPILOT_SECURE_COOKIES, value: {{ .Values.secureCookies | toString | quote }} }
            - { name: KUBEPILOT_MINECRAFT_ROUTER, value: {{ .Values.minecraftRouter.enabled | toString | quote }} }
            - { name: KUBEPILOT_ROOT_INSTALL, value: {{ .Values.serversNamespace.rootInstall | toString | quote }} }
            {{- if .Values.databases.enabled }}
            - { name: KUBEPILOT_DATABASE_ADDR, value: "kubepilot-mariadb.{{ .Values.serversNamespace.name }}.svc.cluster.local:3306" }
            - name: KUBEPILOT_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: kubepilot-mariadb, key: root-password } }
            {{- end }}
            {{- if .Values.sftp.enabled }}
            - { name: KUBEPILOT_SFTP_LISTEN, value: ":2022" }
            - { name: KUBEPILOT_SFTP_PORT, value: {{ .Values.sftp.port | toString | quote }} }
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { containerPort: 8080, name: http }
            {{- if .Values.sftp.enabled }}
            - { containerPort: 2022, name: sftp{{ if .Values.sftp.hostPort }}, hostPort: {{ .Values.sftp.port }}{{ end }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, failureThreshold: 6 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # chown files created for the game user + access to their files
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          volumeMounts:
            - { name: data, mountPath: /data }
            # only the game volumes: never the other applications' volumes on the node
            - { name: storage, mountPath: {{ include "kubepilot.volumesPath" . | quote }} }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ include "kubepilot.dataClaim" . }} }
        - name: storage
          hostPath: { path: {{ include "kubepilot.volumesPath" . | quote }}, type: DirectoryOrCreate }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
