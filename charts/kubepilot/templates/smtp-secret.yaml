{{- if and .Values.email.smtp.host .Values.email.smtp.password (not .Values.email.smtp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubepilot.fullname" . }}-smtp
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kubepilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.email.smtp.password | quote }}
{{- end }}
