name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: Build (typecheck + frontend + go vet + binary)
        run: ./build.sh
      - name: Render manifests
        run: sed -e 's/__HOST__/panel.example.com/' -e 's/__NODE__/node-1/' -e 's/__ISSUER__/letsencrypt-prod/' deploy/k8s.yaml > /dev/null
