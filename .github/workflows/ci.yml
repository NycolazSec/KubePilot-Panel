name: CI
on:
  push:
    branches: [main]
  pull_request:

# least privilege for the workflow token; actions are pinned to commit SHAs (Dependabot keeps them updated)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: Go formatting
        run: test -z "$(gofmt -l backend)" || { gofmt -l backend; exit 1; }
      - name: Build (typecheck + frontend + go vet + go test + binary)
        run: ./build.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: Known vulnerabilities in Go code and dependencies (govulncheck)
        working-directory: backend
        run: |
          mkdir -p web && touch web/.gitkeep
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - name: Known vulnerabilities in npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with: { version: v4.3.2 }
      - name: Lint and validate the Helm chart
        run: |
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform-linux-amd64.tar.gz" | sha256sum -c
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          helm lint charts/kubepilot --set ingress.host=panel.example.com
          helm template kubepilot charts/kubepilot -n kubepilot-system \
            --set ingress.host=panel.example.com --set ingress.clusterIssuer=letsencrypt-prod --set storage.node=node-1 \
            | ./kubeconform -strict -summary
          helm template kubepilot charts/kubepilot -n kubepilot-system --set ingress.host=panel.example.com \
            --set ingress.cloudflareOnly=true --set storage.isolated=false --set storage.className=local-path --set shield.enabled=true \
            | ./kubeconform -strict -summary -ignore-missing-schemas

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (amd64 + arm64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
