name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write   # GitHub release
  packages: write   # image + chart on GHCR
  id-token: write   # keyless signing (cosign)

env:
  IMAGE: ghcr.io/nycolazsec/kubepilot-panel
  CHARTS: oci://ghcr.io/nycolazsec/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push the image (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with: { version: v4.3.2 }
      - name: Package and push the Helm chart
        run: |
          helm package charts/kubepilot --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "kubepilot-${{ steps.v.outputs.version }}.tgz" "$CHARTS"

      - name: GitHub release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          V="${{ steps.v.outputs.version }}"
          # release notes = this version's section of CHANGELOG.md
          awk -v v="$V" '/^## \[/{p = index($0, "[" v "]") > 0; next} /^\[[^]]+\]: /{p = 0} p' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install

          On a Linux server (k3s, HTTPS and the first administrator included), or to update an installation:

          \`\`\`sh
          curl -sfL https://raw.githubusercontent.com/NycolazSec/KubePilot-Panel/main/install.sh | sudo sh -s -- --version ${V}
          \`\`\`

          With Helm, on an existing cluster (then open the panel and enter the setup token from its logs):

          \`\`\`sh
          helm install kubepilot ${CHARTS}/kubepilot --version ${V} \\
            --namespace kubepilot-system --create-namespace \\
            --set ingress.host=panel.example.com --set ingress.clusterIssuer=letsencrypt-prod
          \`\`\`

          Image: \`${IMAGE}:${V}\` (linux/amd64, linux/arm64), signed with cosign.
          NOTES
          flags=""; case "$V" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "KubePilot $V" --notes-file notes.md $flags "kubepilot-${V}.tgz"
