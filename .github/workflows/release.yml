name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write   # GitHub release
  packages: write   # image + chart on GHCR
  id-token: write   # keyless signing (cosign)

env:
  IMAGE: ghcr.io/nycolazsec/kubepilot-panel
  CHARTS: oci://ghcr.io/nycolazsec/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push the image (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - uses: azure/setup-helm@v5
        with: { version: v4.3.2 }
      - name: Package and push the Helm chart
        run: |
          helm package charts/kubepilot --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "kubepilot-${{ steps.v.outputs.version }}.tgz" "$CHARTS"

      - name: GitHub release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          V="${{ steps.v.outputs.version }}"
          # release notes = this version's section of CHANGELOG.md
          awk -v v="$V" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`sh
          helm install kubepilot ${CHARTS}/kubepilot --version ${V} \\
            --namespace kubepilot-system --create-namespace \\
            --set ingress.host=panel.example.com --set ingress.clusterIssuer=letsencrypt-prod
          \`\`\`

          Image: \`${IMAGE}:${V}\` (linux/amd64, linux/arm64), signed with cosign.
          NOTES
          flags=""; case "$V" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "KubePilot $V" --notes-file notes.md $flags "kubepilot-${V}.tgz"
